name: Deploy Supabase functions

# Runs by hand from the Actions tab, and by itself when the notification
# functions change on main. Needs the repo secret SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy, separated by spaces"
        required: true
        default: "send-notification send-booking-notification send-match-reminders"
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-notification/**"
      - "supabase/functions/send-booking-notification/**"
      - "supabase/functions/send-match-reminders/**"
      - "supabase/functions/_shared/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qxafigbrfpxdklwoqkxj
      FUNCTIONS: ${{ github.event.inputs.functions || 'send-notification send-booking-notification send-match-reminders' }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN in GitHub, Settings, Secrets and variables, Actions"; exit 1
          fi
      - name: Deploy
        run: |
          for f in $FUNCTIONS; do
            echo "Deploying $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --yes
          done
