  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Enhanced error handling for debugging
    window.addEventListener('error', function(e) {
      if (e.message.includes('Rb.Configuration')) {
        console.warn('Rb.Configuration error:', e.message, 'Rb:', window.Rb, 'Filename:', e.filename, 'Line:', e.lineno);
        e.preventDefault();
        return true;
      }
      if (e.message.includes('The message port closed')) {
        console.warn('Message port error:', e.message, 'Source:', e.filename);
        e.preventDefault();
        return true;
      }
      if (e.filename && (
        e.filename.includes('jquery') || 
        e.filename.includes('function.js') ||
        e.filename.includes('OneSignal')
      )) {
        console.warn('Suppressed third-party script error:', e.message, 'Source:', e.filename);
        e.preventDefault();
        return true;
      }
    });
  </script>
</body>
